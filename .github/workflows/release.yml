name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  verify-version:
    name: Tag matches package.xml + php_parallax.h
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: extract
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(awk '/<release>/ { gsub(/.*<release>|<\/release>.*/, ""); print; exit }' package.xml)
          HDR_VERSION=$(awk -F'"' '/define PHP_PARALLAX_VERSION/ { print $2; exit }' php_parallax.h)
          echo "tag=$TAG_VERSION pkg=$PKG_VERSION hdr=$HDR_VERSION"
          [ "$TAG_VERSION" = "$PKG_VERSION" ] || { echo "FATAL: tag does not match package.xml"; exit 1; }
          [ "$TAG_VERSION" = "$HDR_VERSION" ] || { echo "FATAL: tag does not match php_parallax.h"; exit 1; }
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

  build-matrix:
    name: Build + test (${{ matrix.image }})
    needs: verify-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - php:8.4-zts-alpine
          - php:8.4-zts-bookworm
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps (alpine)
        if: contains(matrix.image, 'alpine')
        run: apk add --no-cache $PHPIZE_DEPS make
      - name: Install build deps (bookworm)
        if: contains(matrix.image, 'bookworm')
        run: apt-get update && apt-get install -y --no-install-recommends autoconf gcc make
      - name: phpize + configure + make
        run: phpize && ./configure --enable-parallax && make -j$(nproc)
      - name: Run .phpt suite
        run: make test TESTS=tests NO_INTERACTION=1 REPORT_EXIT_STATUS=1

  pecl-tarball:
    name: Build PECL tarball
    needs: build-matrix
    runs-on: ubuntu-latest
    container:
      image: php:8.4-zts-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install pecl
        run: |
          apt-get update
          apt-get install -y --no-install-recommends autoconf gcc make
      - name: Package
        run: |
          # Update <date> and <release> in package.xml from the tag
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s|<date>[^<]*</date>|<date>$(date +%Y-%m-%d)</date>|" package.xml
          sed -i "0,/<release>[^<]*<\\/release>/s||<release>$VERSION</release>|" package.xml
          pecl package
      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: pecl-tarball
          path: ./php-parallax-*.tgz

  docker-images:
    name: Build & push turnkey Docker images
    needs: [verify-version, build-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        base:
          - alpine
          - bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase the registry namespace
        id: ns
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: dist/docker/Dockerfile.${{ matrix.base }}
          push: true
          tags: |
            ghcr.io/${{ steps.ns.outputs.owner }}/php-parallax:${{ needs.verify-version.outputs.version }}-${{ matrix.base }}
            ghcr.io/${{ steps.ns.outputs.owner }}/php-parallax:${{ matrix.base }}

  ai-trace-audit:
    name: AI-trace audit (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit tracked files
        run: |
          if grep -rEi 'claude|anthropic|opus|sonnet|co-authored-by|generated with|assistant' \
              --exclude-dir=.git \
              --exclude=ci.yml --exclude=release.yml \
              --exclude=pre-commit --exclude=commit-msg \
              .; then
            echo "FATAL: AI traces in tracked files"
            exit 1
          fi
      - name: Audit commit messages
        run: |
          if git log --format='%B' | grep -Ei 'claude|anthropic|opus|sonnet|co-authored-by|generated with|assistant'; then
            echo "FATAL: AI traces in commit history"
            exit 1
          fi
      - name: Audit author identity
        run: |
          authors=$(git log --format='%ae' | sort -u)
          [ "$authors" = "a.mashukoff@gmail.com" ] || { echo "FATAL: unexpected author(s): $authors"; exit 1; }
